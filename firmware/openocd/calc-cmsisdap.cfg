# Raspberry Pi Debug Probe (CMSIS-DAP v2) on the 1x6 DEBUG header:
# 3V3, SWCLK, SWDIO, GND, TX, RX. No reset line -> reset via SYSRESETREQ.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 4000
source [file join [file dirname [info script]] calc-common.cfg]
reset_config none
