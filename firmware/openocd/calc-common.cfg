# Common OpenOCD configuration for the calculator board (STM32H743ZGT6).
# Sourced by calc-cmsisdap.cfg / calc-stlink.cfg after the interface is chosen.

set CHIPNAME stm32h743zgt6
# The 1 MB part has two 512 KB banks: 0x08000000 and 0x08100000.
set DUAL_BANK 1
# Declare the stmqspi flash bank for the W25Q128 at 0x90000000 (QUADSPI regs 0x52005000).
if {![info exists QUADSPI]} {
	set QUADSPI 1
}

source [find target/stm32h7x.cfg]

# Configure clocks, pins and the QUADSPI controller so the stmqspi driver can
# talk to the W25Q128 (board pins: CLK PB2 AF9, NCS PG6 AF10, IO0 PF8 AF10,
# IO1 PF9 AF10, IO2 PF7 AF9, IO3 PF6 AF9). Runs with the core halted at reset
# (HSI 64 MHz -> QSPI clock 16 MHz).
proc calc_qspi_init {} {
	mmw 0x580244E0 0x000000FF 0            ;# RCC_AHB4ENR: GPIOA..GPIOH clocks
	mmw 0x580244D4 0x00004000 0            ;# RCC_AHB3ENR: QSPIEN
	sleep 1
	# PB2 = AF9 (CLK)
	mmw 0x58020400 0x00000020 0x00000010   ;# GPIOB_MODER: PB2 alternate
	mmw 0x58020408 0x00000030 0            ;# GPIOB_OSPEEDR: PB2 very high
	mmw 0x58020420 0x00000900 0x00000600   ;# GPIOB_AFRL: PB2 AF9
	# PF6/PF7 = AF9 (IO3/IO2), PF8/PF9 = AF10 (IO0/IO1)
	mmw 0x58021400 0x000AA000 0x00055000   ;# GPIOF_MODER: PF6-PF9 alternate
	mmw 0x58021408 0x000FF000 0            ;# GPIOF_OSPEEDR: very high
	mmw 0x58021420 0x99000000 0x66000000   ;# GPIOF_AFRL: PF6, PF7 AF9
	mmw 0x58021424 0x000000AA 0x00000055   ;# GPIOF_AFRH: PF8, PF9 AF10
	# PG6 = AF10 (NCS), pull-up
	mmw 0x58021800 0x00002000 0x00001000   ;# GPIOG_MODER: PG6 alternate
	mmw 0x58021808 0x00003000 0            ;# GPIOG_OSPEEDR: very high
	mmw 0x5802180C 0x00001000 0x00002000   ;# GPIOG_PUPDR: PG6 pull-up
	mmw 0x58021820 0x0A000000 0x05000000   ;# GPIOG_AFRL: PG6 AF10
	# QUADSPI: PRESCALER=3 (/4), SSHIFT=1; FSIZE=23 (16 MB), CSHT=3
	mww 0x52005000 0x03000010              ;# QUADSPI_CR
	mww 0x52005004 0x00170300              ;# QUADSPI_DCR
	mmw 0x52005000 0x00000001 0            ;# QUADSPI_CR: EN
	# Release the flash from deep power-down (firmware sends B9h before Standby)
	mww 0x52005014 0x000001AB              ;# QUADSPI_CCR: indirect, IMODE=1, instr ABh
	sleep 1
	mmw 0x52005000 0x00000002 0            ;# QUADSPI_CR: ABORT
	sleep 1
	# Memory-mapped 1-1-1 read (03h) so 'mdw 0x90000000' works
	mww 0x52005014 0x0D002503              ;# QUADSPI_CCR: FMODE=3 DMODE=1 ADSIZE=24b ADMODE=1 IMODE=1 instr 03h
}

$_CHIPNAME.cpu0 configure -event reset-init {
	# Clock after reset is HSI 64 MHz
	adapter speed 4000
	global QUADSPI
	if { $QUADSPI } {
		calc_qspi_init
	}
}

# Framebuffer: 320x240 RGB565 little-endian at 0xD0000000 (stride 640 bytes).
# Valid only while the firmware is running (SDRAM is initialised by firmware).
proc calc_dump_fb { file } {
	dump_image $file 0xD0000000 153600
}
